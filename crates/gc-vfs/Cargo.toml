[package]
name        = "gc-vfs"
description = "GameCube/Wii virtual filesystem — mandatory /dev/ device tree, optional storage backends"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gc-hal = { path = "../gc-hal" }
gc-rt  = { path = "../gc-rt" }
gc-fs  = { path = "../gc-fs", optional = true }

[features]
default = []

# ── Filesystem backends (each pulls in gc-fs with the matching sub-feature) ──
fat     = ["dep:gc-fs", "gc-fs/fat",     "_fs"]
ext2    = ["dep:gc-fs", "gc-fs/ext2",    "_fs"]
iso9660 = ["dep:gc-fs", "gc-fs/iso9660", "_fs"]
dvd     = ["dep:gc-fs", "gc-fs/dvd",     "_fs"]
memcard = ["dep:gc-fs", "gc-fs/memcard", "_fs"]

# Convenience: every filesystem at once
all-fs  = ["fat", "ext2", "iso9660", "dvd", "memcard"]

# Internal sentinel — set by any filesystem feature.
# Gate filesystem-only source with #[cfg(feature = "_fs")].
_fs = []

wii = ["gc-hal/wii", "gc-rt/wii"]
