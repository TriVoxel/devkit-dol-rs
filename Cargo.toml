[workspace]
resolver = "2"

members = [
    "crates/gc-rt",
    "crates/gc-hal",
    "crates/gc-gfx",
    "crates/gc-alloc",
    "tools/elf2dol",
    "tools/cargo-dkdol",
    "examples/hello_world",
    "examples/controller_test",
    "examples/spinning_triangle",
    "examples/sine_wave",
    "examples/sd_reader",
    "examples/storage_detect",
    "crates/gc-crash",
    "crates/gc-fs",
]

[workspace.package]
version      = "0.1.0"
authors      = ["devkit-dol contributors"]
edition      = "2021"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/your-org/devkit-dol"

[profile.release]
opt-level  = 2
debug      = false
lto        = true
panic      = "abort"
codegen-units = 1

[profile.dev]
opt-level  = 1        # At least -O1; bare metal + cache sensitivity warrants it
panic      = "abort"
